version: '3'

services:
  web:
    build: .
    command: bash -c "dockerize -wait tcp://db:5432 -timeout 30s python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db 
      - redis
    env_file:
      - .env

  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=url_shortener

  redis:
    image: redis:6-alpine
    ports:
      - "6379:6379"

  celery:
    build: .
    command: bash -c "sleep 5 && celery -A src.config worker -l INFO"
    volumes:
      - .:/app
    depends_on:
      - web
      - redis
    env_file:
      - .env

  celery-beat:
    build: .
    command: bash -c "sleep 5 && celery -A src.config beat -l INFO --scheduler=celery.beat.PersistentScheduler"
    volumes:
      - .:/app
    depends_on:
      - celery
    env_file:
      - .env

volumes:
  postgres_data:
